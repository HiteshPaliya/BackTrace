[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "source-code-reviewer"
version = "0.1.0"
description = "Polyglot Cross-File Source Code Security Reviewer"
readme = "SPEC.md"
requires-python = ">=3.11"
authors = [
    { name = "Hitesh Paliya", email = "hpaliyah@gmail.com" }
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
